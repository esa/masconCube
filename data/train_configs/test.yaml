train:
  n_epochs: 100
  batch_size: 1000
  loss_fn: normalized_l1_loss
  lr: 1.0E-5
  scheduler_factor: 0.8
  scheduler_patience: 2
  scheduler_min_lr: 1.0E-7
  cube_side: 100
  differential: False
  normalize: True
  activation_function: linear
  data_from_trajectory: False
  batch_persistency: 3
  starting_training_data: 2000
  add_data_every_n_epochs: 5
  data_to_add: 1000
  warmup_epochs: 10